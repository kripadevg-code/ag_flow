include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # This is an internal enterprise framework, not a published pub.dev
    # package — exhaustive per-member dartdoc has little payoff without
    # external consumers browsing generated API docs. Classes and
    # non-obvious decisions are still documented; see CONTRIBUTING.md.
    public_member_api_docs: false
    # Cosmetic; `dart format` already keeps lines reasonable.
    lines_longer_than_80_chars: false
    # Prone to false positives on cross-references to types that are
    # deliberately not imported (pure prose mentions in dartdoc) — prefer
    # backtick-quoted names for those instead of chasing this rule.
    comment_references: false
