name: Release

# Fully automated: merging to main verifies the workspace and, for any
# releasable package whose pubspec version has no matching tag yet, cuts
# the git tag and publishes the GitHub Release. Pushing each tag then
# fires publish.yaml, which does the actual pub.dev publish via OIDC.
#
# The publish is split into a tag-triggered workflow on purpose: pub.dev
# trusted publishing verifies the OIDC token's ref against the tag pattern
# configured in the package admin panel (e.g. `ag_flow-v{{version}}`). A
# job running on the `main` branch ref can never match a tag pattern, so
# publishing must run on the tag ref itself. See publish.yaml.
#
# Deliberately driven by the pubspec version rather than by
# `melos version`'s conventional-commit inference. That was tried and
# rejected for concrete reasons: melos versions and tags the example and
# showcase apps (which are demos, not artifacts), bumps 0.1.0 -> 0.1.1 for
# a `feat:` even when the change is breaking, and rewrites CHANGELOG.md in
# its own format — prepending its section above the `# Changelog` heading
# and replacing hand-written release notes with commit subjects.
#
# So the version and the release notes are authored (in the same PR as the
# change), and everything after that is automatic. No human ever runs a
# release command.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # Needed for `gh workflow run` to dispatch publish.yaml after tagging.
  actions: write

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yaml

  integration:
    name: Generator integration
    uses: ./.github/workflows/generator-integration.yaml

  release:
    name: Tag and release
    needs: [verify, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so the workflow can tell what is already
          # released.
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Find packages whose version has no tag yet
        id: pending
        run: |
          set -euo pipefail
          # Releasable packages only. The example and showcase apps are
          # demos and must never be tagged or published.
          packages="packages/ag_flow packages/ag_flow_cli packages/ag_flow_generator"
          pending=""
          for dir in $packages; do
            name=$(grep -m1 '^name:' "$dir/pubspec.yaml" | sed 's/^name: *//')
            version=$(grep -m1 '^version:' "$dir/pubspec.yaml" | sed 's/^version: *//')
            tag="${name}-v${version}"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already released — nothing to do."
            else
              echo "$tag is not released yet."
              pending="$pending $dir"
            fi
          done
          echo "dirs=$(echo $pending | xargs)" >> "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.pending.outputs.dirs == ''
        run: echo "Every releasable package's version is already tagged."

      - name: Tag and create GitHub Releases
        if: steps.pending.outputs.dirs != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for dir in ${{ steps.pending.outputs.dirs }}; do
            name=$(grep -m1 '^name:' "$dir/pubspec.yaml" | sed 's/^name: *//')
            version=$(grep -m1 '^version:' "$dir/pubspec.yaml" | sed 's/^version: *//')
            tag="${name}-v${version}"

            # The quality gate: a release must have real notes. A version
            # bump with no matching CHANGELOG section is a mistake, and
            # failing here is better than publishing an empty release.
            notes=$(mktemp)
            awk -v ver="## $version" '
              $0 == ver { found=1; next }
              found && /^## / { exit }
              found { print }
            ' "$dir/CHANGELOG.md" > "$notes"
            if [ ! -s "$notes" ]; then
              echo "::error::$dir/CHANGELOG.md has no '## $version' section." \
                   "Add the release notes for $version before merging."
              exit 1
            fi

            echo "Releasing $tag"
            git tag -a "$tag" -m "$name $version"
            git push origin "$tag"
            gh release create "$tag" \
              --title "$name $version" \
              --notes-file "$notes"

            # Dispatch publish.yaml AT THE TAG REF. A tag pushed by the
            # default GITHUB_TOKEN does not fire publish.yaml's `push`
            # trigger (GitHub's workflow-recursion guard), but
            # workflow_dispatch is the documented exception that always
            # runs. Running with --ref "$tag" makes publish.yaml's OIDC
            # token carry the tag ref, which is what pub.dev's tag-pattern
            # trusted-publishing check requires.
            echo "Dispatching publish.yaml for $tag"
            gh workflow run publish.yaml --ref "$tag"
          done
