name: Publish to pub.dev

# Fires when release.yaml pushes a release tag (e.g. `ag_flow-v0.2.0`).
#
# Runs on the *tag* ref, so the OIDC token's ref claim
# (`refs/tags/ag_flow-v0.2.0`) matches the tag pattern configured in each
# package's pub.dev trusted-publishing settings
# (`ag_flow-v{{version}}` / `ag_flow_cli-v{{version}}` /
# `ag_flow_generator-v{{version}}`). A branch-triggered job never can,
# which is why publishing is split out of release.yaml.
#
# One-time setup per package in the pub.dev admin panel → Automated
# publishing → Enable publishing from GitHub Actions:
#   Repository:   kripadevg-code/ag_flow
#   Tag pattern:  <package>-v{{version}}
#   Environment:  pub-publish

# Triggered two ways, both of which run on the *tag* ref so the OIDC
# token's ref claim matches pub.dev's tag pattern:
#
#   • workflow_dispatch — how release.yaml fires it (`gh workflow run
#     publish.yaml --ref <tag>`). This is the primary path: a tag pushed
#     by the default GITHUB_TOKEN does NOT trigger a `push` event
#     (GitHub's recursion guard), but workflow_dispatch is an explicit
#     exception that always runs.
#   • push tags — a fallback for a tag pushed by a human or a PAT, which
#     does fire the push event normally.
on:
  workflow_dispatch:
  push:
    tags:
      - "ag_flow-v[0-9]+.[0-9]+.[0-9]+"
      - "ag_flow_cli-v[0-9]+.[0-9]+.[0-9]+"
      - "ag_flow_generator-v[0-9]+.[0-9]+.[0-9]+"

# Declaring any permission defaults all others to `none`, so `contents:
# read` must be explicit or checkout fails with "Repository not found".
permissions:
  contents: read
  # OIDC token for pub.dev trusted publishing — no stored credentials.
  id-token: write

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    # Must match the environment configured on pub.dev for each package.
    environment: pub-publish
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # setup-dart is what actually wires pub's OIDC trusted publishing:
      # with `id-token: write` it exchanges the GitHub OIDC token for a
      # temporary pub.dev token and writes it to the shared pub
      # credentials file. Both `dart pub publish` and `flutter pub
      # publish` then read that file. subosito/flutter-action alone does
      # NOT do this, which is why publishing fell back to interactive
      # login and hung.
      - uses: dart-lang/setup-dart@v1

      - name: Resolve package directory from the tag
        id: pkg
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Strip the trailing -v<version> to get the package name.
          name="${tag%-v*}"
          case "$name" in
            ag_flow)           dir="packages/ag_flow" ;;
            ag_flow_cli)       dir="packages/ag_flow_cli" ;;
            ag_flow_generator) dir="packages/ag_flow_generator" ;;
            *)
              echo "::error::Unrecognized package name '$name' from tag '$tag'."
              exit 1
              ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "dir=$dir"   >> "$GITHUB_OUTPUT"

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Publish to pub.dev
        working-directory: ${{ steps.pkg.outputs.dir }}
        # Always use `dart pub publish` (from setup-dart) — it performs the
        # OIDC token exchange. flutter-action set FLUTTER_ROOT, so pub can
        # still resolve ag_flow's `sdk: flutter` dependency during publish.
        run: dart pub publish --force
