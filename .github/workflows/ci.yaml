name: CI

on:
  # Pushes to main are verified by the Release workflow, which calls this
  # same workflow before it tags — so the checks live in exactly one place
  # and cannot drift between "what CI runs" and "what gates a release".
  pull_request:
  workflow_call:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activate melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Format check
        run: melos run format-check

      - name: Analyze
        run: melos run analyze

      - name: Check Mason bundles are fresh
        run: melos run check-bundles-fresh

      - name: Test
        run: melos run test
