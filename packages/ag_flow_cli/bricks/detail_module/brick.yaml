name: detail_module
description: >-
  Generates the page/controller/repo/service/binding/component files for an
  AG detail (child) module.
version: 0.1.0
environment:
  mason: ">=0.1.0 <0.2.0"
vars:
  app_package_name:
    type: string
    description: The consuming app's own package name (from its pubspec.yaml).
  module_import_path:
    type: string
    description: "The modules/ + root path segment used for package imports, e.g. modules/product."
  module_class_prefix:
    type: string
    description: Cumulative PascalCase class prefix, e.g. ProductDetails.
  module_file_base:
    type: string
    description: snake_case file-name base for layer files, e.g. product_details.
  component_class_prefix:
    type: string
    description: Cumulative, never-pluralized PascalCase prefix for components, e.g. ProductDetails.
  component_file_base:
    type: string
    description: Raw, never-pluralized snake_case file-name base for components, e.g. product_details.
  component_namespace:
    type: string
    description: Bare last path segment, used as the component folder name.
  generate_update:
    type: boolean
    description: Whether to generate an update() stub across Service/Repo/Controller.
    default: true
  generate_delete:
    type: boolean
    description: Whether to generate a delete() stub across Service/Repo/Controller.
    default: true
