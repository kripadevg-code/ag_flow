name: collection_module
description: >-
  Generates the page/controller/repo/service/binding/component files for an
  AG collection (root) module.
version: 0.1.0
environment:
  mason: ">=0.1.0 <0.2.0"
vars:
  app_package_name:
    type: string
    description: The consuming app's own package name (from its pubspec.yaml).
  module_import_path:
    type: string
    description: "The modules/ + root path segment used for package imports, e.g. modules/product."
  module_class_prefix:
    type: string
    description: Cumulative PascalCase class prefix, e.g. Products.
  module_file_base:
    type: string
    description: snake_case file-name base for layer files, e.g. products.
  component_class_prefix:
    type: string
    description: Cumulative, never-pluralized PascalCase prefix for components, e.g. Product.
  component_file_base:
    type: string
    description: Raw, never-pluralized snake_case file-name base for components, e.g. product.
  component_namespace:
    type: string
    description: Bare last path segment, used as the component folder name.
  generate_create:
    type: boolean
    description: Whether to generate a create() stub across Service/Repo/Controller.
    default: true
  model_class:
    type: string
    description: "The module's model type, e.g. Product; `dynamic` when none was given."
    default: dynamic
  model_file_base:
    type: string
    description: snake_case file base for the model, e.g. product.
    default: model
  id_type:
    type: string
    description: "The model's id type, used as the ID type argument of the Service's action mixins."
    default: Object
  has_model:
    type: boolean
    description: Whether a real model type was generated for this module.
    default: false
  generate_update:
    type: boolean
    description: Whether to generate an update() stub across Service/Repo/Controller.
    default: true
  generate_destroy:
    type: boolean
    description: Whether to generate a destroy() stub across Service/Repo/Controller.
    default: true
  needs_resource_endpoint:
    type: boolean
    description: Whether any listed action mixin (retrieve/update/destroy) needs resourceEndpoint.
    default: true
  needs_to_json:
    type: boolean
    description: Whether any listed action mixin (create/update) needs toJson.
    default: true
  paginate:
    type: boolean
    description: Whether the list pages (AgPagination in the Service, AgLoadMore in the Controller).
    default: false
