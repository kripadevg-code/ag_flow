name: ag_flow_example
description: >-
  Generated example app for ag_flow — a collection module and a detail
  module produced end-to-end by ag_flow_cli (ag init && ag g m), used as a
  living, always-buildable acceptance target for the generator.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  ag_flow:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
