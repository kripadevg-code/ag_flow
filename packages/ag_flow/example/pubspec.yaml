name: ag_flow_example
description: >-
  Hand-wired example app for ag_flow (no ag_flow_cli involved) — a
  collection module and a detail module built directly against the runtime
  classes, used both as living documentation and as ag_flow_cli's future
  acceptance target.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  ag_flow:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
