name: ag_flow
description: >-
  Opinionated clean architecture for Flutter: layered feature modules with
  built-in state, DI, route-scoped controllers, paging and a swappable
  network layer.
version: 0.4.0
repository: https://github.com/kripadevg-code/ag_flow
homepage: https://github.com/kripadevg-code/ag_flow
issue_tracker: https://github.com/kripadevg-code/ag_flow/issues
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  collection: ^1.19.0
  dio: ^5.11.0
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Tests only: they drive AgRoutePage through a real GoRouter, the way a
  # generated app does. The app itself owns its go_router dependency.
  go_router: ^17.2.1
  leak_tracker_flutter_testing: any
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
