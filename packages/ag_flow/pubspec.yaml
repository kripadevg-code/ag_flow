  Infraon's opinionated Flutter framework: standardized page/controller/
  repo/service layers, page-state handling, pagination, DI/routing owned
  in-house (no third-party state-management dependency), and a
  centralized networking layer.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
