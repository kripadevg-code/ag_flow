  flutter: ">=3.41.0"

dependencies:
  collection: ^1.19.0
  dio: ^5.11.0
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

