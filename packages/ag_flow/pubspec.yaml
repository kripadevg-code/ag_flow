name: ag_flow
description: >-
  An opinionated Flutter framework: typed page-state, paginated list
  controllers, a type-keyed DI locator, guard-based routing over
  go_router, and a centralized networking layer — zero third-party
  state-management dependency.
version: 0.1.0
repository: https://github.com/kripadevg-code/ag_flow
homepage: https://github.com/kripadevg-code/ag_flow
issue_tracker: https://github.com/kripadevg-code/ag_flow/issues
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  collection: ^1.19.0
  dio: ^5.11.0
  flutter:
    sdk: flutter
  go_router: ^17.2.1
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

