name: ag_showcase_tasks
description: >-
  Architecture reference app for ag_flow — demonstrates ShellRoute
  (persistent bottom nav), AgStateService (auth state), AgGuard (route
  guards), typed Service action mixins, AgPagedService, and optimistic list mutations,
  all in one company-grade project structure.
publish_to: none
resolution: workspace
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  ag_flow:
    path: ../../packages/ag_flow
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  go_router: ^17.2.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
