name: ag_workspace
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - packages/ag_flow
  - packages/ag_flow/example
  - packages/ag_flow_cli

dev_dependencies:
  melos: ^8.2.2
  very_good_analysis: ^10.3.0

# Melos configuration lives here (in the workspace root pubspec.yaml)
# rather than in a separate melos.yaml — this matches Melos's own current
# (8.x) convention of building directly on native pub workspaces.
melos:
  scripts:
    format-check:
      description: >-
        Check formatting across the whole workspace. Deliberately does not
        pass "." — ag_flow_cli/bricks/** are Mason templates containing
        {{mustache}} placeholders and are not valid Dart syntax; `dart
        format` has no exclude mechanism (unlike `dart analyze`, which
        respects analysis_options.yaml), so real source roots are listed
        explicitly instead. Add new top-level source dirs here as they're
        created.
      run: >-
        dart format --output=none --set-exit-if-changed
        packages/ag_flow/lib packages/ag_flow/test
        packages/ag_flow/example/lib
        packages/ag_flow_cli/bin packages/ag_flow_cli/lib
        packages/ag_flow_cli/test packages/ag_flow_cli/tool

    analyze:
      description: >-
        Analyze the whole workspace in one shot — native pub workspaces
        share a single analysis context, so this already covers every
        package without needing melos's per-package `exec`.
      run: dart analyze --fatal-infos .

    test:flow:
      description: Run ag_flow's tests (Flutter).
      exec:
        command: flutter test
      packageFilters:
        scope: ag_flow

    test:cli:
      description: Run ag_flow_cli's tests (pure Dart).
      exec:
        command: dart test
      packageFilters:
        scope: ag_flow_cli

    test:
      description: Run every package's tests.
      run: melos run test:flow && melos run test:cli

    check-bundles-fresh:
      description: >-
        CI guard: fails if a Mason brick under ag_flow_cli/bricks/**/
        __brick__/ was edited without re-bundling into
        lib/src/templates/generated/*.dart (see CONTRIBUTING.md).
      run: dart run packages/ag_flow_cli/tool/check_bundles_fresh.dart
